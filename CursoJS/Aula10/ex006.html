<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{
            font: normal 15pt arial;
            background: green;
            color: black;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id = 'area'>
        interaja...
    </div>
    <script>
        var a = document.querySelector('div#area')
        a.addEventListener('click',clicar)
        a.addEventListener('mouseenter',entrar)
        a.addEventListener('mouseout',sair)
        function clicar(){
            var a = document.querySelector('div#area')
            a.innerText = 'interajou!'
            a.style.background = 'red'
        }
        function entrar(){
            a.innerText = 'atissando'
        }
        function sair(){
            a.innerText = 'desatissando'
            a.style.background = 'green'
        }
    </script>
</body>
</html>
