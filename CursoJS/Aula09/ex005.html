<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body{
            background-color: gray;
            color: orange;
            font: normal 20pr Arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos com DOM</h1>
     <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript</p>     
     <p>aqui vai o resultado</p>
     <div id="msg"> clique em mim </div> 
<script>
    var p1 = window.document.getElementsByTagName('p')[0]
    window.document.write('esta escrito isso: ' + p1.innerText)
    /*
    var d = window.document.getElementById('msg')
    d.style.background = 'green'
    d.innerText = 'ta atissando...'
    
    var d = document.getElementsByName('msg')[0]
    d.style.background = 'blue'
    d.innerText = 'atissado!'
    */
    var d = document.querySelector('div#msg')
    d.innerHTML = 'çafada'
    d.style.background = 'pink'
    //toda div é representada por uma [#] e uma class é um [.]
</script>

</body>
</html>
