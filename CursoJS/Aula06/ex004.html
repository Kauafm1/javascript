<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
        font: normal 20pt arial
        }
    </style>
</head>
<body>
    <script>

        var nome = window.prompt('qual seu nome?')
        document.writeln(`Ola ${nome} seu nome tem ${nome.length} letras<br/>`)
        document.writeln(`seu nome em maiusculas e: ${nome.toUpperCase()}<br/>`)
        document.writeln(`seu nome em minusculas e: ${nome.toLowerCase()}`)
    </script>
</body>
</html>
